[project]
name = "public-skills-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "bot-insights",
  "reportkit",
]

[tool.uv.workspace]
members = [
  "reportkit",
  "packages/bot-insights",
]

[tool.uv.sources]
reportkit = { workspace = true }
bot-insights = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
# Remaining attribution follow-up functions: digest_payload_v1_from_normalized,
# validate_common_evidence_fields, validate_provided_contribution_values,
# validate_specific_evidence_fields, validate_trusted_context,
# render_attribution_sql_template, extract_metadata_layer, result_rows,
# infer_dimensions, validate_baseline_metadata, normalize_input_rows,
# classify_row, build_buckets, normalize_attribution.
"packages/bot-insights/src/bot_insights/attribution.py" = ["C901"]
# Remaining CLI follow-up: split main into report command handlers while
# preserving argparse behavior and bot_insights_report shim patch points.
"packages/bot-insights/src/bot_insights/producers/cli.py" = ["C901"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "off"
reportMissingImports = "none"
