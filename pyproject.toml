[project]
name = "public-skills-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["C901"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "off"
reportMissingImports = "none"
